# Push to main → typecheck + unit tests → deploy the API Worker, then the web app (Pages).
# Database migrations stay manual on purpose (`pnpm deploy:db`), so a schema change never
# ships just because code was pushed. Integration and e2e tests need Docker; run them
# locally before pushing (`pnpm test:integration`, `pnpm test:e2e`).
#
# Repo settings → Secrets and variables → Actions:
#   secret   CLOUDFLARE_API_TOKEN     (Workers Scripts, KV, Pages: Edit; see docs/DEPLOYMENT.md)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable VITE_SUPABASE_URL
#   variable VITE_SUPABASE_ANON_KEY   (public by design; RLS protects the data)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order; a newer push waits rather than cancelling mid-deploy.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and database tests
        run: pnpm test

      - name: Deploy API Worker
        run: pnpm deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy web app
        run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://proposals.bridgerdigital.com/api/health | tee /dev/stderr | grep -q '"configured":true'
