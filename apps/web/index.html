<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bridger Digital Proposals</title>
    <!-- Fonts come from Google (admin: Inter; proposals: brand fonts), loaded by FontGate. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Shown until React replaces #root; matches components/Preloader.tsx. */
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot span { width: 28px; height: 28px; border-radius: 9999px; border: 3px solid rgb(15 42 68 / 0.12); border-top-color: #0f2a44; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
